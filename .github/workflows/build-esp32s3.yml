name: Build ESP32-S3 Firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-esp32s3:
    name: Build ESP32-S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Board Core & Libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "PubSubClient" "ArduinoJson"

      - name: Create Dummy secrets.h for CI
        run: cp firmware-esp32s3/secrets.h.example firmware-esp32s3/secrets.h

      - name: Compile ESP32-S3 Firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,CDCOnBoot=cdc \
            firmware-esp32s3