name: Build STM32F4 Firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-stm32f4:
    name: Build STM32F4
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware-stm32f4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC Toolchain & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build

      - name: Configure & Compile STM32F4 Firmware
        run: |
          cmake -B build -G Ninja
          cmake --build build