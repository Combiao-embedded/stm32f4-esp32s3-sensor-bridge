name: Build STM32F4 Firmware

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-stm32f4:
    name: Build STM32F4
    runs-on: ubuntu-latest
    container:
      image: gabrielsimmer/stm32cubeide:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile STM32F4 Firmware
        run: |
          stm32cubeide --launcher.suppressErrors -nosplash \
            -application org.eclipse.cdt.managedbuilder.core.headlessbuild \
            -data /tmp/workspace \
            -import ./firmware-stm32f4 \
            -build all
